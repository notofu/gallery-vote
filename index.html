<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧</title>
  <style>
    :root {
      --tile-min: 190px;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    header {
      padding: 32px 20px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .description {
      margin: 0;
      color: #666;
    }

    .vote-link {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .summary {
      margin-top: 12px;
      font-size: 14px;
      color: #777;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--tile-min), 1fr));
      gap: 22px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
      box-sizing: border-box;
    }

    .card {
      appearance: none;
      border: 0;
      padding: 0;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.14);
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .info {
      padding: 14px 16px 18px;
      text-align: center;
    }

    .work-id {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
      z-index: 999;
      box-sizing: border-box;
    }

    .modal.open {
      display: flex;
    }

    .modal-inner {
      max-width: 94vw;
      max-height: 94vh;
      text-align: center;
      color: white;
    }

    .modal-inner img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      background: #222;
    }

    .modal-id {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .modal-counter {
      margin-top: 4px;
      font-size: 14px;
      color: #ccc;
    }

    .close {
      position: fixed;
      top: 18px;
      right: 24px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }

    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: white;
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.32);
    }

    .nav-button:active {
      transform: translateY(-50%) scale(0.96);
    }

    .prev-button {
      left: 24px;
    }

    .next-button {
      right: 24px;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 16px;
      }

      .gallery {
        padding: 18px;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .work-id {
        font-size: 18px;
      }

      .modal {
        padding: 14px;
      }

      .modal-inner img {
        max-height: 76vh;
      }

      .nav-button {
        width: 46px;
        height: 46px;
        font-size: 34px;
        background: rgba(255, 255, 255, 0.22);
      }

      .prev-button {
        left: 10px;
      }

      .next-button {
        right: 10px;
      }

      .close {
        top: 10px;
        right: 14px;
        font-size: 36px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

  <div class="modal" id="modal">
    <button class="close" id="close" type="button" aria-label="閉じる">&times;</button>
    <button class="nav-button prev-button" id="prevButton" type="button" aria-label="前の画像">&#8249;</button>
    <button class="nav-button next-button" id="nextButton" type="button" aria-label="次の画像">&#8250;</button>

    <div class="modal-inner">
      <img id="modalImage" src="" alt="">
      <div class="modal-id" id="modalId"></div>
      <div class="modal-counter" id="modalCounter"></div>
      <div class="hint">← → キーでも移動できます</div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modalImage");
    const modalId = document.getElementById("modalId");
    const modalCounter = document.getElementById("modalCounter");
    const closeButton = document.getElementById("close");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const cards = Array.from(document.querySelectorAll(".card"));

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    function isModalOpen() {
      return modal.classList.contains("open");
    }

    function showImage(index) {
      if (cards.length === 0) {
        return;
      }

      currentIndex = (index + cards.length) % cards.length;

      const card = cards[currentIndex];
      const id = card.dataset.id;
      const image = card.dataset.image;

      modalImage.src = image;
      modalImage.alt = id;
      modalId.textContent = id;
      modalCounter.textContent = `${currentIndex + 1} / ${cards.length}`;
    }

    function openModal(index) {
      showImage(index);
      modal.classList.add("open");
    }

    function closeModal() {
      modal.classList.remove("open");
      modalImage.src = "";
    }

    function showPrevious() {
      showImage(currentIndex - 1);
    }

    function showNext() {
      showImage(currentIndex + 1);
    }

    cards.forEach((card, index) => {
      card.addEventListener("click", () => {
        openModal(index);
      });
    });

    closeButton.addEventListener("click", closeModal);

    prevButton.addEventListener("click", event => {
      event.stopPropagation();
      showPrevious();
    });

    nextButton.addEventListener("click", event => {
      event.stopPropagation();
      showNext();
    });

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", event => {
      if (!isModalOpen()) {
        return;
      }

      if (event.key === "Escape") {
        closeModal();
      }

      if (event.key === "ArrowLeft") {
        showPrevious();
      }

      if (event.key === "ArrowRight") {
        showNext();
      }
    });

    modal.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    modal.addEventListener("touchend", event => {
      touchEndX = event.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;

      if (Math.abs(diff) < 50) {
        return;
      }

      if (diff > 0) {
        showPrevious();
      } else {
        showNext();
      }
    }
  </script>
